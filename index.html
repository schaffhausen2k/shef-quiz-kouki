<script>
/*
  共通パスワード設定
  現在のパスワード: xxxxxx

  パスワードを変更する場合は、下の PASSWORD_HASH を新しいパスワードのSHA-256に変更し、
  AUTH_VERSION も v2, v3... のように変更してください。
  そうすると、すでに認証済みの人にも再入力を求められます。
*/
document.addEventListener('DOMContentLoaded', function () {
  const AUTH_VERSION = 'v1';
  const AUTH_KEY = 'koukiShefQuizAuthenticatedVersion';
  const PASSWORD_HASH = '8fdc980de40254731422ea0e5ca7711b1dbfdc1279aa105863bb4b7db79f100e';

  const body = document.body;

  function isAuthenticated() {
    return localStorage.getItem(AUTH_KEY) === AUTH_VERSION;
  }

  function unlockApp() {
    body.classList.remove('auth-locked');
  }

  function lockApp() {
    body.classList.add('auth-locked');
  }

  async function sha256(text) {
    const data = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer))
      .map(function (b) { return b.toString(16).padStart(2, '0'); })
      .join('');
  }

  async function checkPassword() {
    const input = document.getElementById('passwordInput');
    const error = document.getElementById('passwordError');
    const password = input.value;

    error.textContent = '';

    if (!password) {
      error.textContent = 'パスワードを入力してください。';
      return;
    }

    try {
      const inputHash = await sha256(password);
      if (inputHash === PASSWORD_HASH) {
        localStorage.setItem(AUTH_KEY, AUTH_VERSION);
        input.value = '';
        unlockApp();
      } else {
        error.textContent = 'パスワードが違います。';
        input.select();
      }
    } catch (e) {
      error.textContent = 'このブラウザでは認証処理が使えません。Chromeなどで開いてください。';
    }
  }

  if (isAuthenticated()) {
    unlockApp();
  } else {
    lockApp();
    setTimeout(function () {
      const input = document.getElementById('passwordInput');
      if (input) input.focus();
    }, 100);
  }

  const loginBtn = document.getElementById('loginBtn');
  const passwordInput = document.getElementById('passwordInput');

  if (loginBtn) {
    loginBtn.addEventListener('click', checkPassword);
  }

  if (passwordInput) {
    passwordInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        checkPassword();
      }
    });
  }
});
</script>

  });
})();
</script>

<script>
(async function bootstrapQuizApp(){
  const VERSION_STORAGE_KEY = "koukiShefQuizServerVersion";
  const CHECK_INTERVAL_MS = 5 * 60 * 1000;
  const assetFiles = [
    "data/eiyougaku.js",
    "data/syokuhingaku.js",
    "data/foodsafety.js",
    "data/healthylife.js",
    "data/choririron_global.js",
    "data/choririron.js",
    "app.js"
  ];

  async function getServerVersion(){
    const response = await fetch(`version.json?t=${Date.now()}`, {
      cache: "no-store",
      headers: { "Cache-Control": "no-cache" }
    });
    if(!response.ok) throw new Error(`version.json: ${response.status}`);
    const data = await response.json();
    if(!data.version) throw new Error("versionが設定されていません");
    return String(data.version);
  }

  async function clearBrowserCaches(){
    try {
      if("serviceWorker" in navigator){
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration => registration.unregister()));
      }
      if("caches" in window){
        const names = await caches.keys();
        await Promise.all(names.map(name => caches.delete(name)));
      }
    } catch(error){
      console.warn("キャッシュ削除に失敗しました", error);
    }
  }

  function loadScript(src){
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src;
      script.async = false;
      script.onload = resolve;
      script.onerror = () => reject(new Error(`${src} を読み込めませんでした`));
      document.body.appendChild(script);
    });
  }

  let serverVersion;
  try {
    serverVersion = await getServerVersion();
  } catch(error){
    console.warn("更新番号を取得できなかったため、保存済み番号で起動します", error);
    serverVersion = localStorage.getItem(VERSION_STORAGE_KEY) || "fallback-1";
  }

  const savedVersion = localStorage.getItem(VERSION_STORAGE_KEY);
  if(savedVersion && savedVersion !== serverVersion){
    await clearBrowserCaches();
  }

  window.__APP_SERVER_VERSION__ = serverVersion;
  const encodedVersion = encodeURIComponent(serverVersion);
  const stylesheet = document.getElementById("appStylesheet");
  if(stylesheet) stylesheet.href = `style.css?v=${encodedVersion}`;

  try {
    for(const file of assetFiles){
      await loadScript(`${file}?v=${encodedVersion}`);
    }
    localStorage.setItem(VERSION_STORAGE_KEY, serverVersion);

    // カテゴリ生成まで完了してから、アプリ全体を一度に表示する
    requestAnimationFrame(() => {
      document.documentElement.classList.remove("app-loading");
    });
  } catch(error){
    console.error(error);
    document.body.insertAdjacentHTML("afterbegin",
      '<div style="padding:14px;background:#b71c1c;color:white;text-align:center;font-weight:bold;">最新版の読み込みに失敗しました。通信状態を確認して再読み込みしてください。</div>');
    document.documentElement.classList.remove("app-loading");
    return;
  }

  let checking = false;
  async function checkForServerUpdate(){
    if(checking) return;
    checking = true;
    try {
      const latestVersion = await getServerVersion();
      if(latestVersion !== serverVersion){
        await clearBrowserCaches();
        localStorage.setItem(VERSION_STORAGE_KEY, latestVersion);
        const url = new URL(location.href);
        url.searchParams.set("appVersion", latestVersion);
        location.replace(url.toString());
      }
    } catch(error){
      console.warn("更新確認に失敗しました", error);
    } finally {
      checking = false;
    }
  }

  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible") checkForServerUpdate();
  });
  window.addEventListener("pageshow", checkForServerUpdate);
  setInterval(checkForServerUpdate, CHECK_INTERVAL_MS);
})();
</script>
